site_name: PyMRItools
site_description: Python toolbox for MRI sequence programming, reconstruction, simulation, processing and modeling
site_author: Jochen Schmidt
site_url: https://schmidt-jo.github.io/PyMRItools/

# Repository information
repo_name: PyMRItools
repo_url: https://github.com/schmidt-jo/PyMRItools
edit_uri: edit/dev/docs/

# Copyright
copyright: Copyright &copy; 2025 Jochen Schmidt

# Configuration
theme:
  name: readthedocs
  navigation_depth: 3

# Extensions
# pymdown-extensions is installed as a dependency of mkdocstrings, so no extra packages are needed.
markdown_extensions:
  - admonition
  - footnotes
  - meta
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

# Report broken links and anchors as warnings (fails `mkdocs build --strict`)
validation:
  anchors: warn
  unrecognized_links: warn

# Navigation structure
nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started:
      - Concepts & Conventions: concepts.md
      - Command Line Tools: cli.md
      - "Tutorial: MESE R2 Mapping": tutorials/mese_r2_workflow.md
  - Tools:
      - Sequence Programming: sequence_programming.md
      - Raw Data: raw_data.md
      - Reconstruction (LORAKS): recon.md
      - Processing: processing.md
      - Simulation (EMC): simulation.md
      - Modeling: modeling.md
  - API Reference:
      - Overview: api/index.md
      - pymritools.config: api/config.md
      - pymritools.seqprog: api/seqprog.md
      - pymritools.recon: api/recon.md
      - pymritools.processing: api/processing.md
      - pymritools.simulation: api/simulation.md
      - pymritools.modeling: api/modeling.md
      - pymritools.utils: api/utils.md
  - Contributing:
      - Overview: contribute/contributing.md
      - Writing Code: contribute/howto_write_code.md
      - Writing Documentation: contribute/howto_write_docs.md

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            filters:
              - "!^_"
              - "!^log_module$"
              - "!^logger$"
              - "!^log$"
